name: ML CI/CD Pipeline

# This is an example GitHub Actions Workflow for a Machine Learning project.
# It demonstrates how to automate testing, linting, and container building.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r requirements.txt
        pip install flake8 pytest fastapi pydantic scikit-learn numpy

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Uncomment this block when you have a tests/ directory with pytest files
    # - name: Test with pytest
    #   run: |
    #     pytest tests/

  build-docker-image:
    needs: test-and-lint # Wait for tests to pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: 03_Dockerfile
        push: false # Set to true to push to Docker Hub/ECR
        tags: my-ml-app:latest
        
    # Example of deploying (mocked)
    - name: Simulate Deployment
      run: |
        echo "Tests passed and Docker image built successfully."
        echo "Deploying to Staging Environment..."
        sleep 2
        echo "Deployment Successful!"
